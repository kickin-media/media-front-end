repos:
  - repo: builtin
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^pnpm-lock.yaml
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: (.csv$)|(.idea)|(pnpm-lock.yaml)|(^src/shared/back-end/)
      - id: trailing-whitespace
        exclude: ^src/shared/back-end/

  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged
        entry: pnpm exec lint-staged
        language: system
        types: [file]
        pass_filenames: false
